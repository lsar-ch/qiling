name: cross-platform-regression

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  macos-clean:
    runs-on: macos-13
    steps:
      - uses: actions/checkout@v4
      - name: Clean install
        run: ./scripts/setup.sh
      - name: Regression
        run: ./scripts/check.sh

  windows-regression:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Python dependencies
        shell: pwsh
        run: |
          python -m venv .venv
          .venv\Scripts\python.exe -m pip install --upgrade pip
          .venv\Scripts\python.exe -m pip install -e packages\contracts\py -r services\ai-service\requirements.txt
      - name: Frontend dependencies
        shell: pwsh
        run: |
          cd apps\web; npm ci; cd ..
          cd apps\desktop; npm ci; cd ..
      - name: Backend tests
        shell: pwsh
        working-directory: services/ai-service
        run: ..\..\.venv\Scripts\python.exe -m pytest -q
      - name: Typecheck
        shell: pwsh
        run: |
          cd apps\web; npm run typecheck; cd ..
          cd apps\desktop; npm run typecheck; cd ..
