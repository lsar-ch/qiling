[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "qiling-contracts"
version = "0.1.0"
description = "栖灵 shared contracts (single source of truth in Python)"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.5"]

[tool.setuptools.packages.find]
include = ["qiling_contracts*"]
