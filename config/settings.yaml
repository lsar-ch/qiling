app:
  description: 本地优先的桌面 AI 精灵
  name: 栖灵
  version: 0.1.0
awareness:
  active_window:
    enabled: true
    prompt_on_change: false
  screen_capture:
    enabled: false
    interval_seconds: 30
    privacy_mode: true
llm:
  fallback_provider: openai
  max_tokens: 512
  model: qwen-flash
  provider: auto
  stream: true
  system_prompt_path: config/system_prompt.md
  temperature: 0.7
  timeout_seconds: 60
memory:
  db_path: ./data/memory/chat_history.db
  embedding:
    dimension: 384
    model: sentence-transformers/all-MiniLM-L6-v2
  retention:
    days: 90
    max_messages: 10000
  storage: sqlite
  summary:
    enabled: true
    every_n_messages: 10
    model: qwen-flash
proactive:
  enabled: true
  sedentary_minutes: 40
  long_work_minutes: 90
  cooldown_minutes: 30
service:
  cors_origins:
  - http://localhost:5173
  - http://localhost:1420
  - tauri://localhost
  host: 127.0.0.1
  port: 8736
ui:
  always_on_top: true
  animations:
    idle_breathe: true
    listen_pulse: true
    speak_wave: true
    thinking_spin: true
  mode: floating_spring
  opacity: 0.95
  position: center
  size:
    height: 120
    width: 120
  theme: material_blue
voice:
  activation:
    default_state: listening
    enabled: true
    persona_name: 千问
    sleep_phrases:
    - 暂时静默
    - 先静默
    - 先别说话
    - 别说话
    - 安静一下
    - 静默
    wake_prefixes:
    - 你好
    - 嗨
  auto_speak: true
  dashscope:
    api_key: ''
  enabled: true
  interruption:
    auto_barge_in: false
    enabled: true
  minimax:
    api_key: ''
  params:
    emotion: null
    instruction: null
    pitch: 1.0
    speed: 1.05
    volume: 1.0
  stt:
    language: zh
    model: paraformer-realtime-v2
    provider: dashscope
    sample_rate: 16000
  tts:
    format: mp3
    model: speech-01-turbo
    provider: minimax
    sample_rate: 32000
    voice: xiaoming
  volcengine:
    app_id: ''
    cluster: volcano_tts
    token: ''
    voice_type: ''
